name: prune

# Delete a chosen set of rpm-* scratch tags, then rebuild the served image.
# Dispatched by prune-pkg.sh after you interactively pick what to delete -- the
# local machine only figures out the list; ALL GHCR mutations happen here on a
# runner (proper token + bandwidth; the local box never pushes the big image).

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Space-separated tags to DELETE. The rpm- prefix is optional -- paste straight from the list-rpms output.'
        required: true
      allow_shrink:
        description: 'Allow the post-delete rebuild to shrink the image'
        required: false
        default: 'true'

permissions:
  contents: read
  packages: write
  # delete a package version + dispatch -- the runner GITHUB_TOKEN covers these.

jobs:
  prune:
    name: Delete tags + rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sync_repo.sh builds with `buildx --output type=image,push=true`, which the
      # default builder cannot do -- this provides a docker-container driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Check every requested tag EXISTS before deleting anything. Without this a
      # typo (or a name pasted without the rpm- prefix) merely warned per tag and
      # still paid for the ~20 min rebuild below. Abort now instead.
      - name: Resolve and check the requested tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          TAGS: ${{ inputs.tags }}
        run: |
          chmod +x tag-lib.sh
          . ./tag-lib.sh
          ghcr_list_rpm_tags > all-tags.txt
          echo "repo holds $(grep -c . all-tags.txt) rpm-* tag(s)"
          : > to-delete.txt
          missing=""
          for t in $TAGS; do
            [ -n "$t" ] || continue
            case "$t" in rpm-*) full="$t" ;; *) full="rpm-$t" ;; esac
            if grep -qxF "$full" all-tags.txt; then
              echo "$full" >> to-delete.txt
            else
              missing="${missing} ${t}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::no such tag(s):${missing}"
            echo "Nothing was deleted. Names must match the list-rpms output" >&2
            echo "(with or without the rpm- prefix); check for typos." >&2
            exit 1
          fi
          sort -u -o to-delete.txt to-delete.txt
          echo "will delete $(grep -c . to-delete.txt) tag(s):"
          sed 's/^/  /' to-delete.txt

      - name: Delete the chosen tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x tag-lib.sh
          . ./tag-lib.sh
          fail=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            if ghcr_delete_tag "$t"; then echo "  deleted $t"; else echo "  FAILED $t"; fail=1; fi
          done < to-delete.txt
          [ "$fail" -eq 0 ] || echo "::warning::some tags failed to delete (see above)"

      - name: Rebuild :latest (prune-aware)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          PRUNE_REBUILD: ${{ inputs.allow_shrink == 'true' && '1' || '0' }}
        run: |
          df -h /
          chmod +x sync_repo.sh
          ./sync_repo.sh
